name: publish
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = only list what would be posted"
        default: "0"
permissions:
  contents: write
concurrency: publish
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python publish.py
        env:
          IG_TOKEN_ELECTRICITY: ${{ secrets.IG_TOKEN_ELECTRICITY }}
          IG_TOKEN_ELECTRONICS: ${{ secrets.IG_TOKEN_ELECTRONICS }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
      - if: always()
        run: |
          git config user.name "ig-bot"; git config user.email "ig-bot@users.noreply.github.com"
          git add published.json && git commit -m "log publishes" && git push || true
